# ============================================================
# application.properties — Main configuration
# ============================================================
# Runs out-of-the-box with H2 (MySQL mode) for instant start.
# To switch to real MySQL:
#   Run with: --spring.profiles.active=mysql
#   Or configure in application-local.properties
# ============================================================

spring.application.name=movie-booking

# ---------- Server ----------
server.port=8080

# ---------- Database (H2 in-memory MySQL mode — zero setup required) ----------
spring.datasource.url=jdbc:h2:mem:movie_booking_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# ---------- H2 Web Console ----------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JWT ----------
# Secret key for signing JWTs — must be at least 256 bits (32 chars) long
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTSigningThatIsAtLeast256BitsLong!Replace}
# Token expiry: 86400000 ms = 24 hours
app.jwt.expiration-ms=86400000

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------- Logging ----------
logging.level.com.moviebooking=DEBUG
logging.level.org.springframework.security=DEBUG

# ---------- TMDB API Configuration ----------
# Read Access Token is loaded securely via TMDB_ACCESS_TOKEN environment variable.
app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.access-token=${TMDB_ACCESS_TOKEN:}
app.tmdb.api-key=${TMDB_API_KEY:}
app.tmdb.default-region=IN
app.tmdb.cache-ttl-minutes=15
app.tmdb.connect-timeout-seconds=8
app.tmdb.read-timeout-seconds=10

# ---------- Google Places API (New) Configuration ----------
# Key is loaded securely via GOOGLE_PLACES_API_KEY environment variable.
app.google.places.api-key=${GOOGLE_PLACES_API_KEY:}
app.google.places.base-url=https://places.googleapis.com/v1
app.google.places.connect-timeout-seconds=8
app.google.places.read-timeout-seconds=10
app.google.places.default-radius-km=15.0

# ---------- Open Cinema Platform API Configuration ----------
# Key is loaded securely via OPEN_CINEMA_API_KEY environment variable.
app.opencinema.api-key=${OPEN_CINEMA_API_KEY:}
app.opencinema.base-url=https://api.opencinemaproject.com/v1
app.opencinema.connect-timeout-seconds=8
app.opencinema.read-timeout-seconds=10

# ---------- International Showtimes API V5 Configuration ----------
# Key is loaded securely via INTERNATIONAL_SHOWTIMES_API_KEY environment variable.
app.internationalshowtimes.base-url=https://api.internationalshowtimes.com/v5
app.internationalshowtimes.api-key=${INTERNATIONAL_SHOWTIMES_API_KEY:}
app.internationalshowtimes.connect-timeout-seconds=8
app.internationalshowtimes.read-timeout-seconds=10

# ---------- Scheduled Data Refresh Configuration (Asia/Kolkata) ----------
app.refresh.cron.daily-sync=0 0 4 * * *
app.refresh.interval-ms=21600000

# Import local overrides or MySQL profile if present
spring.config.import=optional:classpath:application-local.properties


