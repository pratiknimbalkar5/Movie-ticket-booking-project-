# ============================================================
# application-test.properties — Test configuration
# ============================================================
# Used automatically when running tests (@ActiveProfiles("test"))
# Uses H2 in-memory database so tests don't need real MySQL
# ============================================================

# H2 in-memory database — created fresh for every test run
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: creates schema when tests start, drops it when tests finish
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable MySQL-specific settings for H2
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# JWT test secret
app.jwt.secret=TestSecretKeyForJWTThatIsLongEnoughToBeValid12345678
app.jwt.expiration-ms=3600000

# Suppress verbose output during tests
logging.level.org.springframework.security=WARN
logging.level.com.moviebooking=INFO
