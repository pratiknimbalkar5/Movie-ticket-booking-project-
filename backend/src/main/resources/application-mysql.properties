# ============================================================
# application-mysql.properties — Real MySQL Database Profile
# ============================================================
# Activate with: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:movieapp}
spring.datasource.password=${DB_PASSWORD:MovieApp@2025}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
